server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to 20 MB (phone photos can easily exceed nginx's 1 MB default)
    client_max_body_size 20m;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header X-Frame-Options         "SAMEORIGIN"  always;
    add_header Referrer-Policy         "same-origin" always;
    # CSP: same-origin for everything; data:/blob: for image previews; autoplay for game audio
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; frame-src 'self'" always;

    # Forward API calls to the Express server
    location /api/ {
        proxy_pass         http://server:3002/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Forward uploaded-file requests to the server (drawings + generated sprites)
    location /uploads/ {
        proxy_pass http://server:3002/uploads/;
    }

    # Serve game templates as static files at the same origin (needed for localStorage sharing)
    location /games/ {
        alias /usr/share/nginx/games/;
        try_files $uri $uri/index.html =404;
    }

    # SPA catch-all: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
